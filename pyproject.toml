[project]
name = "brickgen"
version = "0.20.0"
description = "Parametric generator of stud blocks (CadQuery-based) with GUI, 3D preview and multi-format export."
authors = [{ name = "Mistress-Lukutar" }]
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.5",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "PySide6>=6.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff~=0.17.5",
    "mypy>=1.10",
]

[project.scripts]
brickgen = "brickgen.cli.main:app"
brickgen-gui = "brickgen.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brickgen = ["py.typed", "data/templates/*.json"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"

# OCP (pythonocc bindings) ships no type stubs or py.typed marker.
[[tool.mypy.overrides]]
module = "OCP.*"
ignore_missing_imports = true
